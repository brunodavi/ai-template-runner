[project]
name = "ai-template-runner"
version = "1.9.0"
description = "Simple AI workflow based on Markdown templates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "brunodavi", email = "48166556+brunodavi@users.noreply.github.com" }
]
keywords = ["ai", "llm", "templates", "llamacpp", "local-models", "prompt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/brunodavi/ai-template-runner"
Issues = "https://github.com/brunodavi/ai-template-runner/issues"
Changelog = "https://github.com/brunodavi/ai-template-runner/blob/master/CHANGELOG.md"

[project.scripts]
ai-template-runner = "ai_template_runner:main"
ait = "ai_template_runner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
