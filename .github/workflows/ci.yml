name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      # pip-audit bootstraps itself via `python -m pip` inside the active
      # venv; uv-managed venvs do not ship pip, so make it present first.
      - name: Install pip (required by the pip-audit action)
        run: uv pip install pip

      - name: Run the test suite
        run: uv run python -m unittest

      - name: Build distribution
        run: uv build

      - name: Security audit of the built wheel
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: dist/ai_template_runner-*.whl
